meta:
  name:
    full: Modular Independent Neovim Improvements
  link:
    home: https://www.nvim-mini.com
    github: https://github.com/nvim-mini

# Palette is a light variant of minisummer
color:
  palette:
    bg:      "#F3F1E9"
    bg-2:    "#E5E2DB" # OKLch: 90 1 90
    fg:      "#34394A"
    fg-2:    "#212636"
    grey-bg: "#E2E2E2"
    grey:    "#2E2E2E"
    comment: "#6C7285"
    black:   "#0d111f"
    red:     "#870600"
    green:   "#1D7300"
    yellow:  "#626200"
    blue:    "#006699"
    magenta: "#780D60"
    cyan:    "#008064"
    white:   "#FDFBF2"

  foreground: fg
  background: bg
  primary: blue
  secondary: green
  tertiary: magenta
  success: green
  info: cyan
  warning: yellow
  danger: red
  light: white
  dark: black

typography:
  fonts:
  - family: Ubuntu
    source: google

  base:
    family: Ubuntu
  headings:
    weight: bold
    color: primary
  monospace:
    family: monospace
    background-color: bg-2
  monospace-inline:
    color: yellow
    background-color: bg-2
  link:
    color: fg-2
    decoration: underline

defaults:
  bootstrap:
    defaults:
      navbar-bg: "#E5E2DB"
      navbar-fg: "#212636"
      code-block-bg: "#E5E2DB"
    rules: |
      /* General adjustments */
      .blockquote {
        border-left: solid #626200;
        color: #6C7285;
      }
      .cell-output {
        color: #6C7285;
        background: #E2E2E2;
      }
      .about-image { border: solid 2px }
      div.quarto-about-trestles .about-contents { border-left: none }
      div.category { font-size: 0.8rem; }

      p { margin-top: 0em; margin-bottom: 0.5em; }

      p pre code:not(.sourceCode),
      li pre code:not(.sourceCode),
      pre code:not(.sourceCode) {
        background-color: #E5E2DB;
      }

      a { text-decoration-thickness: 0.07em }

      /* Headings */
      h1 { font-size: 2em }
      h2 { font-size: 1.75em; margin-top: 1em; margin-bottom: 0.25em; }
      h3 { font-size: 1.5em; margin-top: 1em; margin-bottom: 0.25em; }
      h4 { font-size: 1.25em; margin-top: 1em; margin-bottom: 0.25em; font-weight: normal; }
      h5 { font-size: 1.1em; font-weight: normal; }
      h6 { font-size: 1em; font-weight: normal; }

      /* Navbar and offset when when navigating to the anchor*/
      .navbar {
        border-bottom: solid 1px #212636;
        min-height: 60px;
      }
      /* Using monospace font is just a visual preference */
      .navbar-title, .nav-item { font-family: monospace }
      :target { scroll-margin-top: 60px; }

      /* Blog listing */
      .blog-listing-item {
        padding-top: 1em;
        padding-bottom: 1em;
        border-bottom: solid 2px #2E2E2E;
      }
      .blog-listing-item-title {
        color: #006699;
        text-decoration: none;
        font-size: 130%;
      }
      .blog-listing-item-description {
        text-decoration: none;
        color: #34394A;
      }
      .blog-listing-item-metadata {
        color: #6C7285;
        text-decoration: none;
      }
      .blog-listing-item-category {
        color: #6C7285;
        text-decoration: none;
        padding: .25em .75em;
        font-size: .65em;
        text-transform: uppercase;
        border: solid 1px;
        border-radius: .25rem;
      }
      /* Help file custom syntax */
      .help-syntax-keys { color: #780D60 }
      .help-syntax-special { color: #626200 }
      h3.help-syntax-right-anchor {
        text-align: right;
        font-size: 1em;
      }
