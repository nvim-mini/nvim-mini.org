meta:
  name:
    full: Modular Independent Neovim Improvements
  link:
    home: https://www.nvim-mini.com
    github: https://github.com/nvim-mini
    bluesky: https://bsky.app/profile/nvim-mini.org

color:
  palette:
    bg:      "#F3F1E9"
    bg-2:    "#E5E2DB" # OKLch: 90 1 90
    fg:      "#34394A"
    fg-2:    "#212636"
    grey-bg: "#E2E2E2"
    grey:    "#2E2E2E"
    comment: "#6C7285"
    black:   "#0d111f"
    red:     "#870600"
    green:   "#1D7300"
    yellow:  "#626200"
    blue:    "#006699"
    magenta: "#780D60"
    cyan:    "#008064"
    white:   "#FDFBF2"

  foreground: fg
  background: bg
  primary: blue
  secondary: green
  tertiary: magenta
  success: green
  info: cyan
  warning: yellow
  danger: red
  light: white
  dark: black

typography:
  fonts:
  - family: Ubuntu
    source: google

  base:
    family: Ubuntu
  headings:
    weight: bold
    color: primary
  monospace:
    family: monospace
    background-color: bg-2
  monospace-inline:
    color: yellow
    background-color: bg-2
  link:
    color: fg-2
    decoration: underline

defaults:
  bootstrap:
    defaults:
      navbar-bg: $brand-bg-2
      navbar-fg: $brand-fg-2
      code-block-bg: $brand-bg-2
