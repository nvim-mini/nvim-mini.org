meta:
  name:
    full: Modular Independent Neovim Improvements
  link:
    home: https://www.nvim-mini.com
    github: https://github.com/nvim-mini

color:
  palette:
    bg:      "#081823"
    bg-2:    "#15242F" # OKLch: 15 3 240
    fg:      "#D5D7C0"
    fg-2:    "#E3E5CE"
    grey-bg: "#222222"
    grey:    "#D4D4D4"
    comment: "#91937D"
    black:   "#000812"
    red:     "#FFC0C4"
    green:   "#B4E3B5"
    yellow:  "#E0D699"
    blue:    "#A1DDFF"
    magenta: "#F0C3F2"
    cyan:    "#94E6E5"
    white:   "#F1F3DC"

  foreground: fg
  background: bg
  primary: blue
  secondary: green
  tertiary: magenta
  success: green
  info: cyan
  warning: yellow
  danger: red
  light: white
  dark: black

typography:
  fonts:
  - family: Ubuntu
    source: google

  base:
    family: Ubuntu
  headings:
    weight: bold
    color: primary
  monospace:
    family: monospace
    background-color: bg-2
  monospace-inline:
    color: cyan
    background-color: bg-2
  link:
    color: fg-2
    decoration: underline

defaults:
  bootstrap:
    defaults:
      navbar-bg: $brand-bg-2
      navbar-fg: $brand-fg-2
      code-block-bg: $brand-bg-2
