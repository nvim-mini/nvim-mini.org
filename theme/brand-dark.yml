meta:
  name:
    full: Modular Independent Neovim Improvements
  link:
    home: https://www.nvim-mini.com
    github: https://github.com/nvim-mini

# Palette is a dark variant of miniwinter
color:
  palette:
    bg:      "#081823"
    bg-2:    "#15242F" # OKLch: 15 3 240
    fg:      "#D5D7C0"
    fg-2:    "#E3E5CE"
    grey-bg: "#222222"
    grey:    "#D4D4D4"
    comment: "#91937D"
    black:   "#000812"
    red:     "#FFC0C4"
    green:   "#B4E3B5"
    yellow:  "#E0D699"
    blue:    "#A1DDFF"
    magenta: "#F0C3F2"
    cyan:    "#94E6E5"
    white:   "#F1F3DC"

  foreground: fg
  background: bg
  primary: blue
  secondary: green
  tertiary: magenta
  success: green
  info: cyan
  warning: yellow
  danger: red
  light: white
  dark: black

typography:
  fonts:
  - family: Ubuntu
    source: google

  base:
    family: Ubuntu
  headings:
    weight: bold
    color: primary
  monospace:
    family: monospace
    background-color: bg-2
  monospace-inline:
    color: cyan
    background-color: bg-2
  link:
    color: fg-2
    decoration: underline

defaults:
  bootstrap:
    defaults:
      navbar-bg: "#15242F"
      navbar-fg: "#E3E5CE"
      code-block-bg: "#15242F"
    rules: |
      /* General adjustments */
      .blockquote {
        border-left: solid #E0D699;
        color: #91937D;
      }
      .cell-output {
        color: #91937D;
        background: #222222;
      }
      .about-image { border: solid 2px }
      div.quarto-about-trestles .about-contents { border-left: none }
      div.category { font-size: 0.8rem; }

      p { margin-top: 0em; margin-bottom: 0.5em; }

      p pre code:not(.sourceCode),
      li pre code:not(.sourceCode),
      pre code:not(.sourceCode) {
        background-color: #15242F;
      }

      a { text-decoration-thickness: 0.07em }

      /* Headings */
      h1 { font-size: 2em }
      h2 { font-size: 1.75em; margin-top: 1em; margin-bottom: 0.25em; }
      h3 { font-size: 1.5em; margin-top: 1em; margin-bottom: 0.25em; }
      h4 { font-size: 1.25em; margin-top: 1em; margin-bottom: 0.25em; font-weight: normal; }
      h5 { font-size: 1.1em; font-weight: normal; }
      h6 { font-size: 1em; font-weight: normal; }

      /* Navbar and offset when when navigating to the anchor*/
      .navbar {
        border-bottom: solid 1px #E3E5CE;
        min-height: 60px;
      }
      /* Using monospace font is just a visual preference */
      .navbar-title, .nav-item { font-family: monospace }
      :target { scroll-margin-top: 60px; }

      /* Blog listing */
      .blog-listing-item {
        padding-top: 1em;
        padding-bottom: 1em;
        border-bottom: solid 2px #D4D4D4;
      }
      .blog-listing-item-title {
        color: #A1DDFF;
        text-decoration: none;
        font-size: 130%;
      }
      .blog-listing-item-description {
        text-decoration: none;
        color: #D5D7C0;
      }
      .blog-listing-item-metadata {
        color: #91937D;
        text-decoration: none;
      }
      .blog-listing-item-category {
        color: #91937D;
        text-decoration: none;
        padding: .25em .75em;
        font-size: .65em;
        text-transform: uppercase;
        border: solid 1px;
        border-radius: .25rem;
      }
      /* Help file custom syntax */
      .help-syntax-keys { color: #F0C3F2 }
      .help-syntax-special { color: #E0D699 }
      h3.help-syntax-right-anchor {
        text-align: right;
        font-size: 1em;
      }
