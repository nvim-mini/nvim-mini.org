project:
  type: website
  output-dir: docs

website:
  title: MINI
  description: "Modular Independent Neovim Improvements"
  site-url: https://nvim-mini.org
  repo-url: https://github.com/nvim-mini
  favicon: /assets/logo-3/logo-mini.svg

  open-graph:
    image: /assets/logo-3/logo-mini_social.png
  twitter-card:
    image: /assets/logo-3/logo-mini_social.png

  navbar:
    search: true
    left:
      - href: mini.nvim/index.md
        text: mini.nvim
      - href: MiniMax/index.md
        text: MiniMax
      - href: blog/index.qmd
        text: Blog
    right:
      - icon: github
        href: https://github.com/nvim-mini
      - icon: git
        href: https://tangled.org/nvim-mini.org
      - icon: bluesky
        href: https://bsky.app/profile/nvim-mini.org
      - icon: rss-fill
        href: blog/index.xml
        aria-label: RSS

  page-footer:
    center: "© Evgeni Chasnovski, [MIT](https://choosealicense.com/licenses/mit/)"

  draft-mode: unlinked

  search:
    show-item-context: tree

format:
  html:
    theme:
      dark:
        - brand
        - theme/styles.scss
      light:
        - brand
        - theme/styles.scss
    toc: true
    respect-user-color-scheme: true
    code-overflow: scroll
    highlight-style:
      dark: theme/minischeme-dark.theme
      light: theme/minischeme-light.theme
    include-after-body: assets/traffic-counter.html
    syntax-definitions:
    - theme/syntax/diffhunks.xml

brand:
  dark: theme/brand-dark.yml
  light: theme/brand-light.yml

execute:
  freeze: true
